site_name: Docs
repo_url: https://github.com/harvard-nrg/docs
theme:
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  features:
    - content.code.copy
    - navigation.expand
  palette:
    # Palette toggle for automatic mode
    - media: (prefers-color-scheme)
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
nav:
  - Claude Code Guide: claude/guide.md
  - Software:
    - iProc:
      - Kilmer: software/iproc/kilmer.md
      - Quickstart: software/iproc/quickstart.md
    - Quality Control:
      - AnatQC: software/qc/anatqc.md
      - BOLDQC: software/qc/boldqc.md
      - DWIQC: software/qc/dwiqc.md
      - T2QC: software/qc/t2qc.md
    - Scan Buddy: software/scanbuddy/scanbuddy.md
